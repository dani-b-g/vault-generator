# Runs on pushes to master and on pull requests. The release workflow calls it too,
# so a release is never published from a commit that does not pass.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22.18.0 is the minimum the README promises; 24 is what development uses
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate-skill

  consistency:
    name: version and installed copies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      # every file agrees on the version, and .claude/skills + .agents/skills match skills/vault-generator
      - run: node tools/version.mjs check

  plugin:
    name: claude plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # exact version, the one the validation was tried with; bump it on purpose, not by accident
      CLAUDE_CODE_VERSION: 2.1.326
      DISABLE_AUTOUPDATER: '1'
      DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      # needs no login. It checks the manifest schema only: it does not check that "source" exists
      # (the plugin test in `npm test` covers that)
      - run: claude plugin validate . --strict
